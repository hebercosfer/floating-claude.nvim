name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (nvim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    # nightly breaking is Neovim's news, not ours -- report it without failing
    # the run.
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.11.7 # the floor the README promises
          - v0.12.4
          - nightly

    steps:
      - uses: actions/checkout@v7

      # Pinned rather than tracking plenary's default branch, so a change over
      # there cannot turn this repo's CI red on its own. Moved deliberately, at
      # release prep, with the suite green on the new one.
      - name: Check out plenary.nvim
        uses: actions/checkout@v7
        with:
          repository: nvim-lua/plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
          path: .tests/plenary.nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run the suite
        env:
          PLENARY_DIR: ${{ github.workspace }}/.tests/plenary.nvim
        run: make test

  lint:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  # One check whose name does not move when the matrix does. Every "test (nvim
  # X)" context carries a version, so a branch ruleset naming one would wedge
  # any line that does not test exactly that version -- and each maintenance
  # line tests a different floor. This is the context a ruleset can require.
  tests:
    name: tests
    needs: test
    # always(), or a failing matrix skips this job -- and a skipped required
    # check blocks a pull request forever instead of failing it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the whole matrix passed
        # 'success' only when every leg passed. nightly is continue-on-error,
        # so its breakage never reaches here -- the call ci.yml already makes.
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]