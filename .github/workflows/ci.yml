name: CI

on:
  push:
    # The 0.1.x maintenance line. A push to main runs main's own copy of this
    # file, so only this branch belongs here.
    branches: [support/nvim-0.10]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (nvim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This line exists for 0.10, so 0.10 is the only thing it proves. Newer
        # releases are main's to cover: a green 0.12 here says nothing about the
        # runtime anyone pins ~0.1.0 for, and nightly would only ever report
        # that Neovim moved on -- which is the news main is for.
        #
        # Kept as a matrix of one so the job name stays "test (nvim vX)" and the
        # aggregator below keeps working unchanged when the floor moves.
        neovim:
          - v0.10.4 # the floor the README promises, and the newest 0.10 there is

    steps:
      - uses: actions/checkout@v7

      # Pinned rather than tracking plenary's default branch, so a change over
      # there cannot turn this repo's CI red on its own.
      - name: Check out plenary.nvim
        uses: actions/checkout@v7
        with:
          repository: nvim-lua/plenary.nvim
          ref: master
          path: .tests/plenary.nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run the suite
        env:
          PLENARY_DIR: ${{ github.workspace }}/.tests/plenary.nvim
        run: make test

  lint:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  # One check whose name does not move when the matrix does. Every "test (nvim
  # X)" context carries a version, so a branch ruleset naming one would wedge
  # any line that does not test exactly that version -- and each maintenance
  # line tests a different floor. This is the context a ruleset can require.
  tests:
    name: tests
    needs: test
    # always(), or a failing matrix skips this job -- and a skipped required
    # check blocks a pull request forever instead of failing it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the whole matrix passed
        # 'success' only when every leg passed. This line's matrix is one leg
        # today, but the job stays: it is the required context, and it must not
        # have to change if the floor ever gains a second version to prove.
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]